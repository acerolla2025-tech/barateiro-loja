<!doctype html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Barateiro Delivery</title>
<style>
body{font-family:Arial;padding:20px;background:#f5f5f5}
.card{background:white;padding:15px;margin:10px;border-radius:12px}
button{padding:10px}
</style>
</head>
<body>
<h1>🛒 Barateiro Delivery</h1>
<h2>Produtos</h2>
<div id="produtos"></div>

<script>
fetch('/api/products')
.then(r=>r.json())
.then(p=>{
 document.getElementById('produtos').innerHTML=p.map(x=>`
 <div class="card">
 <h3>${x.name}</h3>
 <p>R$ ${x.price}</p>
 <button>Adicionar</button>
 </div>`).join('');
});
</script>
</body>
</html>
